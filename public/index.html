ow:hidden;position:relative}.hero:after{content:"";position:absolute;width:320px;height:320px;border:55px solid rgba(255,255,255,.07);border-radius:50%;left:-90px;bottom:-180px}.hero h1{font-size:31px;margin:0 0 8px}.hero p{margin:0;color:#dbeaff;line-height:1.8}.hero-actions{display:flex;gap:9px;align-items:flex-end;position:relative;z-index:1}.hero .btn{background:#fff;color:var(--p);border-color:#fff}.section{margin-top:24px}.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.section-head h2{font-size:19px;margin:0}.muted{color:var(--muted);font-size:12px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}.card{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:17px;box-shadow:var(--shadow)}.stat .value{font-size:25px;font-weight:950;margin:7px 0}.stat .trend{font-size:11px;color:var(--ok);font-weight:800}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.product{overflow:hidden;padding:0}.product-img{height:145px;background:linear-gradient(135deg,#edf6ff,#d9eaff);display:grid;place-items:center;font-size:58px}.product-body{padding:15px}.product h3{margin:0 0 5px;font-size:15px}.price{font-size:19px;font-weight:950;color:var(--p);margin:9px 0}.row{display:flex;align-items:center;gap:9px}.between{justify-content:space-between}.tag{display:inline-flex;padding:5px 9px;border-radius:999px;font-size:10.5px;font-weight:900}.tag.blue{background:var(--sky);color:var(--p)}.tag.ok{background:#e8f8f1;color:var(--ok)}.tag.warn{background:#fff4df;color:var(--warn)}.tag.red{background:#ffebeb;color:var(--danger)}.deal-card{display:grid;grid-template-columns:1.4fr .8fr;gap:20px}.timeline{display:grid;grid-template-columns:repeat(10,1fr);gap:5px;margin-top:18px}.tl{text-align:center;font-size:9px;color:var(--muted)}.tl i{display:block;height:7px;border-radius:99px;background:var(--line);margin-bottom:6px}.tl.done{color:var(--p);font-weight:900}.tl.done i{background:linear-gradient(90deg,var(--p),#168bf3)}.money{background:var(--sky);border:1px solid #d4e5fa;border-radius:15px;padding:15px}.money strong{font-size:25px}.table{width:100%;border-collapse:collapse;font-size:13px}.table th,.table td{padding:12px 9px;border-bottom:1px solid var(--line);text-align:right}.table th{font-size:10px;color:var(--muted);background:var(--sky)}.chat{display:grid;grid-template-columns:285px 1fr;gap:14px;min-height:620px}.rooms,.chatbox{background:#fff;border:1px solid var(--line);border-radius:17px;overflow:hidden}.room{padding:14px;border-bottom:1px solid var(--line);display:flex;gap:10px;cursor:pointer}.room.active{background:var(--sky);border-right:3px solid var(--p)}.avatar{width:40px;height:40px;border-radius:50%;background:#dcecff;color:var(--p);display:grid;place-items:center;font-weight:950}.chat-head{padding:13px 15px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.messages{height:470px;overflow:auto;background:#f7faff;padding:17px}.bubble{max-width:72%;padding:10px 12px;border-radius:14px;margin:7px 0;line-height:1.65;font-size:13px}.bubble.me{background:var(--p);color:#fff;margin-right:auto;border-bottom-right-radius:4px}.bubble.them{background:#fff;border:1px solid var(--line);margin-left:auto;border-bottom-left-radius:4px}.compose{padding:10px;border-top:1px solid var(--line);display:flex;gap:8px}.compose textarea{flex:1;resize:none;border:1px solid var(--line);border-radius:12px;padding:10px}.call{min-width:46px;background:#e8f8f1;color:var(--ok);border:1px solid #c7ebdc;border-radius:12px;font-size:20px}.modal{position:fixed;inset:0;background:rgba(7,30,62,.65);display:none;align-items:center;justify-content:center;padding:20px;z-index:50}.modal.show{display:flex}.modalbox{width:min(720px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:20px;padding:22px}.field{margin:11px 0}.field label{display:block;font-size:11px;color:var(--muted);font-weight:900;margin-bottom:6px}.input,.textarea{width:100%;border:1px solid var(--line);border-radius:11px;padding:11px;background:#fff;outline:none}.input:focus,.textarea:focus{border-color:var(--p)}.empty{padding:30px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:14px;background:var(--sky)}
.auth{min-height:100vh;display:grid;grid-template-columns:1.15fr .85fr}.auth-left{background:linear-gradient(135deg,#073b82,#168bf3);color:#fff;padding:70px;display:flex;flex-direction:column;justify-content:center}.auth-left h1{font-size:52px;margin:0 0 12px}.auth-left p{max-width:600px;line-height:1.9;color:#dcecff}.auth-right{display:flex;align-items:center;justify-content:center;padding:30px}.authbox{width:min(460px,100%)}.roles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0}.roles button{padding:12px;border:1px solid var(--line);border-radius:11px;background:#fff;font-weight:900}.roles button.on{border-color:var(--p);background:var(--sky);color:var(--p)}.otp{display:grid;grid-template-columns:repeat(6,1fr);gap:7px}.otp input{text-align:center;padding:12px;border:1px solid var(--line);border-radius:10px;font-size:20px;font-weight:900}.mobile-nav{display:none}
@media(max-width:1050px){.layout{grid-template-columns:76px}.sidebar{padding:14px 8px}.brandtext,.role span,.nav label{display:none}.nav button{justify-content:center}.stats,.grid4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:720px){.topbar{padding:0 13px}.layout{display:block}.sidebar{display:none}.content{padding:14px 12px 82px}.hero{padding:22px;display:block}.hero h1{font-size:25px}.hero-actions{margin-top:18px}.stats,.grid4{grid-template-columns:1fr 1fr}.deal-card{grid-template-columns:1fr}.timeline{grid-template-columns:repeat(5,1fr);row-gap:12px}.chat{grid-template-columns:1fr}.rooms{max-height:180px;overflow:auto}.auth{grid-template-columns:1fr}.auth-left{display:none}.auth-right{padding:18px}.mobile-nav{display:flex;position:fixed;bottom:0;right:0;left:0;height:64px;background:#fff;border-top:1px solid var(--line);z-index:30}.mobile-nav button{flex:1;border:0;background:none;font-size:10px;color:var(--muted)}.mobile-nav button.active{color:var(--p);font-weight:900}.brand small{display:none}.top-actions .pill{display:none}}

<body>
<div id="root"></div>
<div id="modal" class="modal"><div class="modalbox"><div class="row between"><h2 id="mtitle" style="margin:0"></h2><button class="iconbtn" onclick="closeModal()">×</button></div><div id="mbody" style="margin-top:15px"></div></div></div>
<script>
"use strict";
const $=s=>document.querySelector(s), $$=s=>document.querySelectorAll(s);
const app={role:"merchant",page:"home",chat:"supplier",deal:4,logged:false,messages:{supplier:[],driver:[],admin:[]}};
const roles={merchant:"التاجر",supplier:"المورد",driver:"السائق",admin:"الإدارة"};
const stages=["طلب شراء","عروض الموردين","تفاوض","اتفاق","الدفع الضامن","التحميل","السائق","النقل","الوصول","الفحص","الاستلام","التسوية","الإغلاق"];
const products=[["أرز بسمتي فاخر","1,180","500 طن","🌾","شركة الخليج"],["سكر أبيض ICUMSA","1,200","300 طن","◻️","شركة النخبة"],["زيت دوار الشمس","1,160","200 كرتون","🫗","تك تريد"],["تمور سكري","1,600","120 كرتون","🌴","مزارع الوادي"]];
function modal(t,b){$("#mtitle").textContent=t;$("#mbody").innerHTML=b;$("#modal").classList.add("show")}
function closeModal(){$("#modal").classList.remove("show")}
function toast(x){modal("وسيط",'<div class="empty">'+x+"</div>")}
function login(){
 $("#root").innerHTML='<div class="auth"><section class="auth-left"><div class="logo" style="margin-bottom:18px">و</div><h1>وسيط</h1><p>Waseet B2B Trade & Logistics<br>من المنتج إلى بابك.. كل خطوة في منصة واحدة.</p><div style="margin-top:25px;display:flex;gap:8px;flex-wrap:wrap"><span class="tag" style="background:rgba(255,255,255,.14);color:#fff">تجارة B2B</span><span class="tag" style="background:rgba(255,255,255,.14);color:#fff">دفع ضامن</span><span class="tag" style="background:rgba(255,255,255,.14);color:#fff">لوجستيات</span><span class="tag" style="background:rgba(255,255,255,.14);color:#fff">حماية الأطراف</span></div></section><section class="auth-right"><div class="authbox"><div style="text-align:center"><div class="logo" style="margin:auto">و</div><h2>ابدأ مع وسيط</h2><p class="muted">اختر نوع الحساب للدخول إلى مساحة العمل</p></div><div class="roles">'+Object.entries(roles).map(([k,v])=>'<button class="'+(app.role===k?"on":"")+'" onclick="app.role=\''+k+'\';login()">'+v+"</button>").join("")+'</div><div class="field"><label>رقم الجوال</label><input class="input" value="05XXXXXXXX" inputmode="tel"></div><button class="btn large" style="width:100%" onclick="sendOtp()">إرسال رمز التحقق</button><p class="muted" style="text-align:center;margin-top:14px">تجربة المتصفح: رمز OTP هو 123456</p></div></section></div>'
}
function sendOtp(){modal("التحقق من الجوال",'<p class="muted">أدخل رمز التحقق المكوّن من 6 أرقام.</p><div class="otp">'+[0,1,2,3,4,5].map(i=>'<input id="o'+i+'" maxlength="1" inputmode="numeric" oninput="nextOtp('+i+')">').join("")+'</div><button class="btn" style="width:100%;margin-top:14px" onclick="verify()">تحقق ودخول</button>')}
function nextOtp(i){if($("#o"+i)?.value&&i<5)$("#o"+(i+1)).focus()}
function verify(){let x="";for(let i=0;i<6;i++)x+=$("#o"+i)?.value||"";if(x!=="123456"){toast("رمز التحقق غير صحيح");return}app.logged=true;closeModal();render()}
function nav(p){app.page=p;render();scrollTo(0,0)}
function shell(){
const navs=app.role==="merchant"?[["home","⌂","الرئيسية"],["market","▦","السوق"],["requests","＋","الطلبات"],["deals","◫","الصفقات"],["chat","◉","المحادثات"]]:app.role==="supplier"?[["home","⌂","الرئيسية"],["requests","＋","طلبات الشراء"],["deals","◫","الصفقات"],["chat","◉","المحادثات"]]:app.role==="driver"?[["home","⌂","المهمة الحالية"],["deals","◫","الشحنات"],["chat","◉","المحادثات"]]:[["home","⌂","لوحة الإدارة"],["deals","◫","الصفقات"],["chat","◉","المحادثات"]];
return '<div class="app"><header class="topbar"><div class="brand"><div class="logo">و</div><div><b>وسيط</b><small>Waseet B2B Trade & Logistics</small></div></div><div class="top-actions"><span class="pill">'+roles[app.role]+'</span><button class="iconbtn" onclick="toast(\'الإشعارات محفوظة للنسخة المتصلة\')">🔔</button><button class="iconbtn" onclick="app.logged=false;login()">↪</button></div></header><div class="layout"><aside class="sidebar"><div class="role">'+roles[app.role]+' <span>· مساحة عمل</span></div><nav class="nav">'+navs.map(n=>'<button class="'+(app.page===n[0]?"active":"")+'" onclick="nav(\''+n[0]+'\')"><b>'+n[1]+'</b><label>'+n[2]+"</label></button>").join("")+'</nav></aside><main class="content" id="content"></main></div><nav class="mobile-nav">'+navs.slice(0,5).map(n=>'<button class="'+(app.page===n[0]?"active":"")+'" onclick="nav(\''+n[0]+'\')"><div style="font-size:18px">'+n[1]+"</div>"+n[2]+"</button>").join("")+"</nav></div>"
}
function home(){
const role=roles[app.role];
if(app.role==="driver")return '<div class="hero"><div><h1>مهمة الشحن الحالية</h1><p>استلام شحنة أرز بسمتي من المورد وتسليمها للتاجر.</p></div><div class="hero-actions"><button class="btn" onclick="advance()">تحديث الحالة</button></div></div>'+dealBlock();
if(app.role==="admin")return '<div class="hero"><div><h1>لوحة حماية وسيط</h1><p>متابعة الصفقات، المدفوعات، التحميل، النقل، الفحص والنزاعات من مكان واحد.</p></div></div><div class="stats section">'+[['صفقات نشطة','18'],['مدفوعات قيد التحقق','6'],['شحنات بالنقل','9'],['نزاعات مفتوحة','2']].map(x=>'<div class="card stat"><div class="muted">'+x[0]+'</div><div class="value">'+x[1]+'</div><div class="trend">تحتاج متابعة</div></div>').join("")+'</div>'+dealBlock();
return '<div class="hero"><div><h1>'+(app.role==="merchant"?"اشترِ بثقة.. وبِع بذكاء":"أدر منتجاتك ووصل إلى التجار")+'</h1><p>من الطلب والتفاوض إلى الدفع الضامن والنقل والفحص والتسوية، كل خطوة موثقة داخل وسيط.</p></div><div class="hero-actions"><button class="btn" onclick="app.page=app.role===\'merchant\'?\'market\':\'requests\';render()">'+(app.role==="merchant"?"تصفح السوق":"عرض طلبات الشراء")+"</button></div></div>"+statsBlock()+dealBlock()+(app.role==="merchant"?marketBlock():"");
}
function statsBlock(){return '<div class="stats section">'+[['إجمالي قيمة الصفقات','610,000 ر.س'],['الصفقات النشطة','8'],['الطلبات المفتوحة','24'],['الرصيد الضامن','0 ر.س']].map(x=>'<div class="card stat"><div class="muted">'+x[0]+'</div><div class="value">'+x[1]+'</div><div class="trend">● محدث الآن</div></div>').join("")+"</div>"}
function marketBlock(){return '<div class="section"><div class="section-head"><h2>منتجات مقترحة</h2><button class="btn secondary" onclick="nav(\'market\')">كل السوق</button></div><div class="grid4">'+products.slice(0,4).map(productCard).join("")+"</div></div>"}
function productCard(p){return '<article class="card product"><div class="product-img">'+p[3]+'</div><div class="product-body"><h3>'+p[0]+'</h3><div class="muted">'+p[4]+' · '+p[2]+'</div><div class="price">'+p[1]+' ر.س</div><div class="row"><button class="btn" style="flex:1" onclick="openProduct(\''+p[0]+'\')">طلب عرض</button><button class="btn secondary" onclick="app.page=\'chat\';app.chat=\'supplier\';render()">💬</button></div></div></article>"}
function openProduct(name){modal(name,'<div class="money"><div class="muted">سعر المورد المبدئي</div><strong>1,180 ر.س</strong><div class="muted" style="margin-top:7px">الكمية المتاحة: 500 طن</div></div><div class="field"><label>الكمية المطلوبة</label><input class="input" value="100"></div><div class="field"><label>ملاحظات ومواصفات</label><textarea class="textarea" rows="3" placeholder="المواصفات، بلد المنشأ، موعد التسليم..."></textarea></div><button class="btn" style="width:100%" onclick="closeModal();app.page=\'chat\';render()">بدء التفاوض مع المورد</button>')}
function dealBlock(){return '<div class="section"><div class="section-head"><h2>الصفقة #WST-000125</h2><span class="tag blue">'+stages[app.deal]+'</span></div><div class="card deal-card"><div><div class="row between"><div><b>أرز بسمتي فاخر</b><div class="muted" style="margin-top:4px">التاجر: الأفق للتجارة · المورد: شركة الخليج</div></div><span class="tag ok">🛡 الدفع الضامن</span></div><div class="timeline">'+stages.slice(0,10).map((s,i)=>'<div class="tl '+(i<=app.deal?"done":"")+'"><i></i>'+s+'</div>').join("")+"</div></div><div class="money"><div class="muted">إجمالي الصفقة</div><strong>610,000 ر.س</strong><div style="margin-top:12px" class="muted">البضاعة 590,000 · الشحن 20,000</div><button class="btn" style="width:100%;margin-top:14px" onclick="advance()">"+(app.deal<stages.length-1?"تنفيذ الخطوة التالية":"الصفقة مكتملة")+"</button></div></div></div>"}
function advance(){if(app.deal<stages.length-1)app.deal++;render()}
function market(){ $("#content").innerHTML='<div class="section-head"><div><h2>السوق</h2><div class="muted">عروض الموردين متاحة للتجار</div></div><button class="btn" onclick="modal(\'طلب شراء جديد\',\'<div class=field><label>المنتج</label><input class=input placeholder=\'اسم المنتج\'></div><div class=field><label>الكمية</label><input class=input placeholder=\'الكمية\'></div><button class=btn style=width:100% onclick=closeModal()>نشر الطلب</button>\')">+ طلب شراء</button></div><div class="grid4">'+products.concat(products).map(productCard).join("")+"</div>"}
function requests(){ $("#content").innerHTML='<div class="section-head"><div><h2>'+(app.role==="supplier"?"طلبات شراء التجار":"طلباتي")+'</h2><div class="muted">كل الطلبات والعروض المرتبطة بك</div></div></div><div class="card"><table class="table"><tr><th>المنتج</th><th>الكمية</th><th>الوجهة</th><th>الحالة</th><th></th></tr>'+["أرز بسمتي فاخر","سكر أبيض ICUMSA","تمور سكري","زيت دوار الشمس"].map((x,i)=>'<tr><td><b>'+x+'</b></td><td>'+[100,300,120,200][i]+' طن</td><td>جدة</td><td><span class="tag '+(i%2?"warn":"blue")+'">'+(i%2?"بانتظار العرض":"تفاوض")+'</span></td><td><button class="btn secondary" onclick="app.page=\'chat\';render()">فتح</button></td></tr>').join("")+"</table></div>"}
function deals(){ $("#content").innerHTML='<div class="section-head"><div><h2>الصفقات</h2><div class="muted">حالة الصفقة في كل مرحلة</div></div></div>'+dealBlock()+'<div class="section card"><h3>سجل الإجراءات</h3><table class="table"><tr><th>الوقت</th><th>الإجراء</th><th>الطرف</th></tr><tr><td>10:42</td><td>تم تحديث حالة الصفقة</td><td>وسيط</td></tr><tr><td>10:15</td><td>تم رفع مستند التحميل</td><td>المورد</td></tr><tr><td>09:48</td><td>تم اعتماد العرض</td><td>التاجر</td></tr></table></div>"}
function chat(){const rooms=[["supplier","شركة الخليج","تفاوض الصفقة #125"],["driver","أحمد — السائق","النقل"],["admin","إدارة وسيط","حماية الصفقة"]];$("#content").innerHTML='<div class="chat"><div class="rooms">'+rooms.map(r=>'<div class="room '+(app.chat===r[0]?"active":"")+'" onclick="app.chat=\''+r[0]+'\';render()"><div class="avatar">'+r[1][0]+'</div><div><b>'+r[1]+'</b><div class="muted">'+r[2]+'</div></div></div>').join("")+'</div><div class="chatbox"><div class="chat-head"><div class="row"><div class="avatar">'+rooms.find(r=>r[0]===app.chat)[1][0]+'</div><div><b>'+rooms.find(r=>r[0]===app.chat)[1]+'</b><div class="muted">● متصل · الرسائل محفوظة</div></div></div><button class="call" onclick="call()">☎</button></div><div class="messages">'+(app.messages[app.chat].length?app.messages[app.chat].map(m=>'<div class="bubble '+m.who+'">'+m.text+'</div>').join(""):'<div class="empty">لا توجد رسائل بعد<br>ابدأ التفاوض من هنا.</div>')+'</div><div class="compose"><textarea id="msg" rows="2" placeholder="اكتب رسالة..."></textarea><button class="btn" onclick="send()">إرسال</button></div></div></div>'}
function call(){modal("مكالمة صوتية",'<div class="empty"><div style="font-size:42px">☎</div><b>اتصال بالطرف الآخر</b><p>زر الاتصال جاهز في واجهة التفاوض. ربط مزود الاتصال الحقيقي يتم في مرحلة خدمات الاتصال والإشعارات.</p></div>')}
function send(){let x=$("#msg").value.trim();if(!x)return;app.messages[app.chat].push({who:"me",text:x});render()}
function render(){if(!app.logged){login();return}$("#root").innerHTML=shell();if(app.page==="home")$("#content").innerHTML=home();else if(app.page==="market")market();else if(app.page==="requests")requests();else if(app.page==="deals")deals();else if(app.page==="chat")chat();else $("#content").innerHTML=home()}
login();
</script>
</body>
</html>
