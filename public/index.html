<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#075fc9">
<title>وسيط | Waseet B2B Trade & Logistics</title>
<style>
:root{--blue:#075fc9;--dark:#073b82;--bg:#f5f9ff;--line:#dce7f3;--text:#10233f;--muted:#718198;--white:#fff;--green:#11966a}
*{box-sizing:border-box}body{margin:0;font-family:Arial,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}button,input,textarea{font:inherit}button{cursor:pointer}
.top{height:68px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 18px;position:sticky;top:0;z-index:5}.brand{display:flex;align-items:center;gap:10px;font-weight:900}.logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--dark),#168bf3);color:#fff;display:grid;place-items:center;font-size:20px}.muted{color:var(--muted);font-size:12px}
.layout{display:grid;grid-template-columns:220px 1fr;max-width:1450px;margin:auto}.side{background:#fff;border-left:1px solid var(--line);min-height:calc(100vh - 68px);padding:16px;position:sticky;top:68px;height:calc(100vh - 68px)}.side button{display:block;width:100%;border:0;background:transparent;text-align:right;padding:13px;border-radius:10px;color:var(--muted);font-weight:800;margin:4px 0}.side button.active{background:#eef6ff;color:var(--blue)}
.main{padding:22px;max-width:1250px;width:100%;margin:auto}.hero{background:linear-gradient(115deg,var(--dark),#168bf3);color:#fff;border-radius:22px;padding:28px;display:flex;justify-content:space-between;gap:20px}.hero h1{margin:0 0 8px;font-size:30px}.hero p{margin:0;line-height:1.8;color:#dcecff}.btn{border:0;border-radius:11px;padding:11px 15px;background:var(--blue);color:#fff;font-weight:800}.btn.light{background:#eef6ff;color:var(--blue)}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:18px}.value{font-size:23px;font-weight:900;margin:8px 0}.section{margin-top:22px}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:11px}.head h2{margin:0;font-size:18px}.products{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}.prod{padding:0;overflow:hidden}.pic{height:125px;background:#eaf4ff;display:grid;place-items:center;font-size:48px}.prodbody{padding:14px}.price{color:var(--blue);font-size:18px;font-weight:900;margin:8px 0}.tag{display:inline-block;background:#eef6ff;color:var(--blue);padding:5px 8px;border-radius:99px;font-size:10px;font-weight:800}
.deal{display:grid;grid-template-columns:1fr 280px;gap:16px}.money{background:#eef6ff;border-radius:14px;padding:15px}.timeline{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:20px}.step{font-size:9px;text-align:center;color:var(--muted)}.step i{display:block;height:7px;background:var(--line);border-radius:9px;margin-bottom:5px}.step.done{color:var(--blue);font-weight:900}.step.done i{background:var(--blue)}
.chat{display:grid;grid-template-columns:260px 1fr;gap:12px;min-height:600px}.rooms,.chatbox{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden}.room{padding:14px;border-bottom:1px solid var(--line);cursor:pointer}.room.active{background:#eef6ff;border-right:3px solid var(--blue)}.chathead{padding:13px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}.messages{height:470px;overflow:auto;padding:15px;background:#f7faff}.bubble{max-width:75%;padding:10px 12px;border-radius:13px;margin:7px 0;font-size:13px}.me{background:var(--blue);color:#fff;margin-right:auto}.them{background:#fff;border:1px solid var(--line);margin-left:auto}.compose{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line)}textarea{flex:1;border:1px solid var(--line);border-radius:11px;padding:10px;resize:none}.call{border:1px solid #c7ebdc;background:#e8f8f1;color:var(--green);border-radius:11px;width:45px;font-size:20px}
.auth{min-height:100vh;display:grid;grid-template-columns:1fr 1fr}.authleft{background:linear-gradient(135deg,var(--dark),#168bf3);color:#fff;padding:60px;display:flex;flex-direction:column;justify-content:center}.authleft h1{font-size:52px;margin:12px 0}.authright{display:flex;align-items:center;justify-content:center;padding:25px}.authbox{width:min(430px,100%)}.roles{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:15px 0}.roles button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px;font-weight:800}.roles button.sel{background:#eef6ff;border-color:var(--blue);color:var(--blue)}.field{margin:12px 0}.field label{display:block;font-size:11px;color:var(--muted);font-weight:800;margin-bottom:5px}.input{width:100%;border:1px solid var(--line);border-radius:10px;padding:12px}
.modal{position:fixed;inset:0;background:#001a3d99;display:none;align-items:center;justify-content:center;padding:20px;z-index:20}.modal.show{display:flex}.modalbox{background:#fff;border-radius:18px;padding:20px;width:min(520px,100%)}.otp{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}.otp input{width:100%;padding:12px;text-align:center;border:1px solid var(--line);border-radius:9px;font-size:20px}
@media(max-width:900px){.layout{grid-template-columns:1fr}.side{display:none}.products{grid-template-columns:repeat(2,1fr)}.stats{grid-template-columns:repeat(2,1fr)}.deal{grid-template-columns:1fr}}
@media(max-width:650px){.auth{grid-template-columns:1fr}.authleft{display:none}.main{padding:12px 10px 20px}.hero{display:block;padding:22px}.hero h1{font-size:24px}.products{grid-template-columns:1fr 1fr}.chat{grid-template-columns:1fr}.rooms{max-height:180px;overflow:auto}.timeline{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>
<div id="root"></div>
<div id="modal" class="modal"><div class="modalbox"><div class="head"><h3 id="modalTitle"></h3><button class="btn light" id="closeModal">إغلاق</button></div><div id="modalBody"></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
"use strict";
const db=window.supabase.createClient("https://zwsvlrptnlchajqgqtvm.supabase.co","sb_publishable_1S4CCi-cGjyJE7PO87fueg_H8NFkZrA");
const state={logged:false,role:"merchant",page:"home",stage:0,chat:"supplier",messages:[],user:null,profile:null,dealId:null,sub:null};
const roles={merchant:"التاجر",supplier:"المورد",driver:"السائق",admin:"الإدارة"};
const stages=["طلب شراء","عروض الموردين","تفاوض","اتفاق","الدفع","التحميل","السائق","النقل","الوصول","الفحص","الاستلام","التسوية","الإغلاق"];
const products=[
{name:"أرز بسمتي فاخر",price:"1,180",qty:"500 طن",icon:"🌾",supplier:"شركة الخليج"},
{name:"سكر أبيض ICUMSA",price:"1,200",qty:"300 طن",icon:"◻️",supplier:"شركة النخبة"},
{name:"زيت دوار الشمس",price:"1,160",qty:"200 كرتون",icon:"🫗",supplier:"تك تريد"},
{name:"تمور سكري",price:"1,600",qty:"120 كرتون",icon:"🌴",supplier:"مزارع الوادي"}
];

function el(id){return document.getElementById(id)}
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]))}
function ensureModal(){if(el("modal"))return;document.body.insertAdjacentHTML("beforeend",'<div id="modal" class="modal"><div class="modalbox"><div class="head"><h3 id="modalTitle"></h3><button class="btn light" id="closeModal">إغلاق</button></div><div id="modalBody"></div></div></div>');el("closeModal").onclick=()=>el("modal").classList.remove("show")}
function showModal(title,body){ensureModal();el("modalTitle").textContent=title;el("modalBody").innerHTML=body;el("modal").classList.add("show")}
el("closeModal").onclick=()=>el("modal").classList.remove("show");

function login(){document.body.innerHTML=`<div class="auth"><section class="authleft"><div class="logo">و</div><h1>وسيط</h1><p>Waseet B2B Trade & Logistics</p></section><section class="authright"><div class="authbox"><h2>تسجيل الدخول / إنشاء حساب</h2><div class="roles">${Object.entries(roles).map(([k,v])=>`<button class="${state.role===k?"sel":""}" data-role="${k}">${v}</button>`).join("")}</div><div class="field"><label>رقم الجوال</label><input id="phone" class="input" placeholder="05XXXXXXXX"></div><button id="sendOtp" class="btn" style="width:100%">دخول برمز SMS</button><button id="register" class="btn light" style="width:100%;margin-top:8px">إنشاء حساب جديد</button></div></section></div>`;document.querySelectorAll("[data-role]").forEach(x=>x.onclick=()=>{state.role=x.dataset.role;login()});el("sendOtp").onclick=async()=>{const raw=el("phone").value.trim(),p=raw.startsWith("05")?"+966"+raw.slice(1):raw.startsWith("966")?"+"+raw:raw;if(p.length<10)return alert("أدخل رقم جوال صحيح");state.pendingPhone=p;const q=await db.auth.signInWithOtp({phone:p});if(q.error)return alert(q.error.message);otp(false)};el("register").onclick=registration}
function registration(){if(state.role==="admin"){return alert("إنشاء حساب الإدارة يتم من خلال رقم الإدارة المعتمد فقط.");}showModal("إنشاء حساب جديد",`<div class="field"><label>الاسم الكامل</label><input id="rname" class="input"></div><div class="field"><label>اسم المنشأة</label><input id="rbiz" class="input"></div><div class="field"><label>البريد الإلكتروني</label><input id="remail" class="input" type="email"></div><div class="field"><label>العنوان</label><input id="raddress" class="input"></div><div id="docFields"></div><div class="field"><label>رقم الجوال</label><input id="rphone" class="input" placeholder="05XXXXXXXX"></div><button id="startReg" class="btn" style="width:100%">متابعة</button>`);const docs=state.role==="merchant"?[[ "commercial_registration","السجل التجاري"],["national_id","هوية صاحب المنشأة"]]:state.role==="supplier"?[[ "commercial_registration","السجل التجاري"],["national_id","هوية المسؤول"],["bank_certificate","مستند الحساب البنكي"]]:[[ "national_id","الهوية"],["driver_license","رخصة القيادة"],["vehicle_registration","استمارة المركبة"],["vehicle_insurance","تأمين المركبة"]];el("docFields").innerHTML=docs.map(d=>`<div class="field"><label>${d[1]} *</label><input class="input regdoc" data-doc-type="${d[0]}" type="file" accept=".pdf,image/*" required></div>`).join("");el("startReg").onclick=async()=>{const raw=el("rphone").value.trim(),p=raw.startsWith("05")?"+966"+raw.slice(1):raw.startsWith("966")?"+"+raw:raw;if(p.length<10)return alert("أدخل رقم جوال صحيح");const ds=[...document.querySelectorAll(".regdoc")].map(x=>({type:x.dataset.docType,file:x.files[0]}));if(ds.some(x=>!x.file))return alert("أكمل جميع المستندات المطلوبة");state.pendingPhone=p;state.pendingRegistration={full_name:el("rname").value.trim(),business_name:el("rbiz").value.trim(),email:el("remail").value.trim()||null,address:el("raddress").value.trim()||null,documents:ds};const q=await db.auth.signInWithOtp({phone:p});if(q.error)return alert(q.error.message);el("modal").classList.remove("show");otp(true)}}

async function finishRegistration(){const r=state.pendingRegistration;if(!r)return;const q=await db.from("profiles").insert({id:state.user.id,role:state.role,phone:state.user.phone,full_name:r.full_name,business_name:r.business_name,email:r.email,address:r.address,verification_status:"pending"}).select().single();if(q.error)return alert(q.error.message);for(const d of r.documents){const path=state.user.id+"/"+d.type+"-"+Date.now()+"-"+d.file.name.replace(/[^a-zA-Z0-9._-]/g,"_");const u=await db.storage.from("documents").upload(path,d.file,{upsert:false});if(u.error)return alert(u.error.message);const x=await db.from("profile_documents").insert({user_id:state.user.id,document_type:d.type,file_url:path,status:"pending"});if(x.error)return alert(x.error.message)}state.profile=q.data;state.logged=true;delete state.pendingRegistration;state.page="home";el("modal").classList.remove("show");await loadRemote();render()}
function otp(reg){showModal("التحقق من الجوال",`<div class="otp">${[0,1,2,3,4,5].map(i=>`<input maxlength="1" inputmode="numeric" id="o${i}">`).join("")}</div><button id="verify" class="btn" style="width:100%;margin-top:14px">تحقق</button>`);el("verify").onclick=async()=>{const token=[0,1,2,3,4,5].map(i=>el("o"+i).value).join("");const q=await db.auth.verifyOtp({phone:state.pendingPhone,token,type:"sms"});if(q.error)return alert(q.error.message);state.user=q.data.user;if(reg)return finishRegistration();let p=(await db.from("profiles").select("*").eq("id",state.user.id).maybeSingle()).data;if(!p){const x=await db.from("profiles").insert({id:state.user.id,role:state.role,phone:state.user.phone}).select().single();if(x.error)return alert(x.error.message);p=x.data}state.profile=p;state.role=p.role;state.logged=true;el("modal").classList.remove("show");await loadRemote();render()}}

async function loadRemote(){const [p,r,d]=await Promise.all([db.from("products").select("*").eq("status","active").order("created_at",{ascending:false}),db.from("purchase_requests").select("*").order("created_at",{ascending:false}),db.from("deals").select("*").order("updated_at",{ascending:false})]);if(!p.error&&p.data?.length)products.splice(0,products.length,...p.data.map(x=>({name:x.name,price:Number(x.price||0).toLocaleString(),qty:(x.quantity??0)+" "+(x.unit||""),icon:"📦",supplier:x.supplier_id,id:x.id})));state.remoteRequests=r.data||[];state.remoteDeals=d.data||[];state.dealId=state.remoteDeals[0]?.id||null;}
function nav(page){state.page=page;render()}
function shell(){
const navs=state.role==="merchant"?["home","market","requests","deals","chat"]:state.role==="supplier"?["home","requests","deals","chat"]:state.role==="driver"?["home","deals","chat"]:["home","verification","deals","chat"];
const labels={home:"الرئيسية",market:"السوق",requests:"الطلبات",verification:"التحقق من الحسابات",deals:"الصفقات",chat:"المحادثات"};
return `<header class="top"><div class="brand"><div class="logo">و</div><div>وسيط<div class="muted">Waseet B2B Trade & Logistics</div></div></div><div><span class="tag">${roles[state.role]}</span> <button class="btn light" id="logout">خروج</button></div></header><div class="layout"><aside class="side">${navs.map(n=>`<button class="${state.page===n?"active":""}" data-nav="${n}">${labels[n]}</button>`).join("")}</aside><main class="main" id="main"></main></div><div id="modal" class="modal"><div class="modalbox"><div class="head"><h3 id="modalTitle"></h3><button class="btn light" id="closeModal">إغلاق</button></div><div id="modalBody"></div></div></div>`;
}
function bindNav(){document.querySelectorAll("[data-nav]").forEach(b=>b.onclick=()=>nav(b.dataset.nav));el("logout").onclick=async()=>{if(state.sub){await db.removeChannel(state.sub);state.sub=null}if(state.voiceWatch){await db.removeChannel(state.voiceWatch);state.voiceWatch=null}await endVoice(false);const {error}=await db.auth.signOut();if(error)return alert(error.message);state.logged=false;state.user=null;state.profile=null;state.dealId=null;state.remoteDeals=[];state.messages=[];login()}}
function stats(){return `<div class="stats">${[["قيمة الصفقات","610,000 ر.س"],["الصفقات النشطة","8"],["الطلبات المفتوحة","24"],["الرصيد الضامن","0 ر.س"]].map(x=>`<div class="card"><div class="muted">${x[0]}</div><div class="value">${x[1]}</div><span class="tag">محدث الآن</span></div>`).join("")}</div>`}
function currentDeal(){return (state.remoteDeals||[]).find(d=>d.id===state.dealId)||state.remoteDeals?.[0]||null}
function stageIndex(s){return {negotiation:2,payment:4,loading:5,transport:7,inspection:9,settlement:11,closing:12,dispute:12}[s]??0}
function deal(){
const d=currentDeal(); if(!d)return '<div class="card"><h2>لا توجد صفقة نشطة</h2><p class="muted">ابدأ بطلب شراء وقبول عرض مورد.</p></div>';
state.dealId=d.id; const idx=stageIndex(d.stage);
return '<div class="section"><div class="head"><h2>الصفقة #'+esc(d.id.slice(0,8).toUpperCase())+'</h2><span class="tag">'+esc(d.stage)+'</span></div><div class="card deal"><div><b>صفقة تجارية موثقة</b><p class="muted">البضاعة: '+Number(d.total_goods||0).toLocaleString()+' ر.س · الشحن: '+Number(d.shipping_cost||0).toLocaleString()+' ر.س</p><div class="timeline">'+stages.map((s,i)=>'<div class="step '+(i<=idx?'done':'')+'"><i></i>'+s+'</div>').join('')+'</div></div><div class="money"><div class="muted">إجمالي الصفقة</div><div class="value">'+Number(d.total_amount||0).toLocaleString()+' ر.س</div><div id="transactionAction"></div></div></div></div><div id="transactionPanel" class="section"></div>';
}
async function bindDeal(){
const d=currentDeal(); if(!d)return;
const box=el("transactionAction"); const panel=el("transactionPanel"); if(!box||!panel)return;
let html='';
if(state.role==='admin'&&d.stage==='payment') html='<span class="tag">مراجعة دفعة التاجر</span>';
else if(d.stage==='negotiation') html='<button id="goPayment" class="btn" style="width:100%">الانتقال إلى الدفع</button>';
else if(d.stage==='payment') html='<button id="payBtn" class="btn" style="width:100%">إرسال إثبات التحويل</button>';
else if(d.stage==='loading') html='<button id="shipmentBtn" class="btn" style="width:100%">بيانات التحميل والسائق</button>';
else if(d.stage==='transport') html='<button id="transportBtn" class="btn" style="width:100%">تحديث النقل / التسليم</button>';
else if(d.stage==='inspection') html='<button id="inspectionBtn" class="btn" style="width:100%">تسجيل نتيجة الفحص</button>';
else if(d.stage==='settlement') html='<button id="closeBtn" class="btn" style="width:100%">تأكيد التسوية والإغلاق</button>';
else if(d.stage==='closing') html='<span class="tag">تم إغلاق الصفقة</span>';
else if(d.stage==='dispute') html='<span class="tag">الصفقة قيد النزاع</span>';
box.innerHTML=html;
panel.innerHTML='<div class="card"><div class="head"><h3>إجراءات الصفقة</h3><span class="muted">كل إجراء يسجل في سجل الصفقة</span></div><div id="actionContent"></div></div>';
const ac=el("actionContent");
const q=await db.from("payments").select("*").eq("deal_id",d.id).order("created_at",{ascending:false}).limit(3);
const pay=q.data?.[0];
if(state.role==='admin'&&d.stage==='payment'){await renderAdminPayment(d,ac);return}
if(d.stage==='payment'&&pay) ac.innerHTML='<div class="money">آخر دفعة: '+Number(pay.amount||0).toLocaleString()+' ر.س · <b>'+esc(pay.status)+'</b>'+(pay.rejection_reason?'<div class="muted">سبب الرفض: '+esc(pay.rejection_reason)+'</div>':'')+'</div>';
if(d.stage==='loading') await renderShipmentAction(d,ac);
if(d.stage==='transport') await renderTransportAction(d,ac);
if(d.stage==='inspection') await renderInspectionAction(d,ac);
if(d.stage==='settlement') await renderSettlementAction(d,ac);
if(d.stage==='dispute') await renderDisputeAction(d,ac);
if(el("goPayment"))el("goPayment").onclick=async()=>{const x=await db.rpc("advance_deal_stage",{p_deal_id:d.id,p_target_stage:"payment"});if(x.error)return alert(x.error.message);await loadRemote();render()};
if(el("payBtn"))el("payBtn").onclick=()=>showPaymentForm(d);
if(el("shipmentBtn"))el("shipmentBtn").onclick=()=>renderShipmentAction(d,ac);
if(el("transportBtn"))el("transportBtn").onclick=()=>renderTransportAction(d,ac);
if(el("inspectionBtn"))el("inspectionBtn").onclick=()=>renderInspectionAction(d,ac);
if(el("closeBtn"))el("closeBtn").onclick=async()=>{const x=await db.rpc("advance_deal_stage",{p_deal_id:d.id,p_target_stage:"closing"});if(x.error)return alert(x.error.message);await loadRemote();render()};
}
async function showPaymentForm(d){
const s=await db.from("admin_settings").select("*").eq("id",true).single();const a=s.data||{};
showModal("الدفع الضامن",'<div class="money"><b>المبلغ المطلوب: '+Number(d.total_amount||0).toLocaleString()+' ر.س</b><p class="muted">اسم البنك: '+esc(a.bank_name||"يحدد من الإدارة")+'<br>اسم الحساب: '+esc(a.bank_account_name||"-")+'<br>IBAN: '+esc(a.iban||"-")+'</p></div><div class="field"><label>رقم مرجع التحويل</label><input id="payRef" class="input"></div><div class="field"><label>إرفاق إيصال التحويل</label><input id="payFile" class="input" type="file" accept=".pdf,image/*"></div><button id="submitPayment" class="btn" style="width:100%">إرسال للتحقق</button>');
el("submitPayment").onclick=async()=>{const file=el("payFile").files[0];if(!file)return alert("أرفق إيصال التحويل");const path=state.user.id+"/"+d.id+"-"+Date.now()+"-"+file.name.replace(/[^a-zA-Z0-9._-]/g,"_");const u=await db.storage.from("payment-proofs").upload(path,file,{upsert:false});if(u.error)return alert(u.error.message);const x=await db.from("payments").insert({deal_id:d.id,amount:d.total_amount,method:"bank_transfer",status:"pending",reference:el("payRef").value.trim(),proof_url:path});if(x.error)return alert(x.error.message);el("modal").classList.remove("show");await loadRemote();render()};
}
async function renderShipmentAction(d,ac){

let voice={pc:null,stream:null,callId:null,channel:null,pendingOffer:null};
async function setupCallerPeer(callId){voice.pc=new RTCPeerConnection({iceServers:[{urls:"stun:stun.l.google.com:19302"}]});voice.stream=await navigator.mediaDevices.getUserMedia({audio:true,video:false});voice.stream.getTracks().forEach(t=>voice.pc.addTrack(t,voice.stream));voice.pc.ontrack=e=>{let a=document.getElementById("remoteAudio");if(!a){a=document.createElement("audio");a.id="remoteAudio";a.autoplay=true;a.playsInline=true;document.body.appendChild(a)}a.srcObject=e.streams[0]};voice.pc.onicecandidate=e=>{if(e.candidate)voice.channel.send({type:"broadcast",event:"signal",payload:{callId:callId,from:state.user.id,kind:"ice",candidate:e.candidate}})};const offer=await voice.pc.createOffer();await voice.pc.setLocalDescription(offer);voiceUi("اتصال صوتي","جاري الاتصال بالطرف الآخر...",true);voice.channel.send({type:"broadcast",event:"signal",payload:{callId:callId,from:state.user.id,kind:"offer",offer:offer}})}
async function startVoiceCall(){
if(!state.dealId)return alert("لا توجد صفقة مرتبطة بالمحادثة.");
if(!navigator.mediaDevices?.getUserMedia)return alert("الميكروفون غير مدعوم في هذا الجهاز.");
const r=await db.rpc("start_voice_call",{p_deal_id:state.dealId});if(r.error)return alert(r.error.message);
const callId=r.data;voice.callId=callId;voice.channel=db.channel("voice-"+callId);
voice.channel.on("broadcast",{event:"signal"},async msg=>{const p=msg.payload;if(!p||p.callId!==callId||p.from===state.user.id)return;if(p.kind==="accept"&&!voice.pc){await setupCallerPeer(callId)}if(p.kind==="answer"&&voice.pc)await voice.pc.setRemoteDescription(p.answer);if(p.kind==="ice"&&voice.pc)try{await voice.pc.addIceCandidate(p.candidate)}catch(e){}if(p.kind==="end")endVoice(false)}).subscribe();
}
function voiceUi(title,status,connected){showModal(title,'<div style="text-align:center"><div style="font-size:44px">☎</div><p id="voiceStatus">'+status+'</p><button id="endVoice" class="btn light">إنهاء المكالمة</button></div>');document.getElementById("endVoice").onclick=()=>endVoice(true)}
async function acceptVoiceCall(call,offer){
voice.callId=call.id;voice.channel=db.channel("voice-"+call.id);
voice.channel.on("broadcast",{event:"signal"},async msg=>{const p=msg.payload;if(!p||p.from===state.user.id)return;if(p.kind==="ice"&&voice.pc)try{await voice.pc.addIceCandidate(p.candidate)}catch(e){}if(p.kind==="end")endVoice(false)}).subscribe(async status=>{
if(status!=="SUBSCRIBED")return;
await db.from("voice_calls").update({status:"accepted"}).eq("id",call.id);
voice.pc=new RTCPeerConnection({iceServers:[{urls:"stun:stun.l.google.com:19302"}]});
voice.pc.ontrack=e=>{let a=document.getElementById("remoteAudio");if(!a){a=document.createElement("audio");a.id="remoteAudio";a.autoplay=true;a.playsInline=true;document.body.appendChild(a)}a.srcObject=e.streams[0]};
voice.pc.onicecandidate=e=>{if(e.candidate)voice.channel.send({type:"broadcast",event:"signal",payload:{callId:call.id,from:state.user.id,kind:"ice",candidate:e.candidate}})};
await voice.pc.setRemoteDescription(offer);voice.stream=await navigator.mediaDevices.getUserMedia({audio:true,video:false});voice.stream.getTracks().forEach(t=>voice.pc.addTrack(t,voice.stream));
const answer=await voice.pc.createAnswer();await voice.pc.setLocalDescription(answer);voiceUi("اتصال صوتي","متصل صوتياً",true);voice.channel.send({type:"broadcast",event:"signal",payload:{callId:call.id,from:state.user.id,kind:"answer",answer:answer}});
});
}
async function endVoice(local){if(local&&voice.callId){await db.from("voice_calls").update({status:"ended",ended_at:new Date().toISOString()}).eq("id",voice.callId);if(voice.channel)voice.channel.send({type:"broadcast",event:"signal",payload:{callId:voice.callId,from:state.user.id,kind:"end"}})}if(voice.stream)voice.stream.getTracks().forEach(t=>t.stop());if(voice.pc)voice.pc.close();if(voice.channel)await db.removeChannel(voice.channel);voice={pc:null,stream:null,callId:null,channel:null,pendingOffer:null};if(document.getElementById("modal"))document.getElementById("modal").classList.remove("show")}
async function watchIncomingVoiceCalls(){if(!state.user)return;const q=await db.from("voice_calls").select("*").eq("callee_id",state.user.id).eq("status","ringing").order("created_at",{ascending:false}).limit(1);if(q.data?.[0])showIncomingCall(q.data[0]);if(state.voiceWatch)await db.removeChannel(state.voiceWatch);state.voiceWatch=db.channel("voice-incoming-"+state.user.id).on("postgres_changes",{event:"INSERT",schema:"public",table:"voice_calls",filter:"callee_id=eq."+state.user.id},payload=>{if(payload.new?.status==="ringing")showIncomingCall(payload.new)}).subscribe()}
async function showIncomingCall(call){const p=await db.from("profiles").select("full_name,business_name").eq("id",call.caller_id).maybeSingle();showModal("مكالمة واردة",'<div style="text-align:center"><div style="font-size:44px">☎</div><p>اتصال صوتي من '+esc(p.data?.business_name||p.data?.full_name||"الطرف الآخر")+'</p><div style="display:flex;gap:8px;justify-content:center"><button id="acceptVoice" class="btn">قبول</button><button id="rejectVoice" class="btn light">رفض</button></div></div>');
document.getElementById("rejectVoice").onclick=async()=>{await db.from("voice_calls").update({status:"rejected"}).eq("id",call.id);document.getElementById("modal").classList.remove("show")};
document.getElementById("acceptVoice").onclick=async()=>{document.getElementById("modal").classList.remove("show");const ch=db.channel("voice-"+call.id);ch.on("broadcast",{event:"signal"},async msg=>{const x=msg.payload;if(x?.kind==="offer"){await db.removeChannel(ch);acceptVoiceCall(call,x.offer)}}).subscribe(async status=>{if(status==="SUBSCRIBED"){ch.send({type:"broadcast",event:"signal",payload:{callId:call.id,from:state.user.id,kind:"accept"}})}})};
}
async function loadDealEvents(){const d=currentDeal();if(!d||!el("eventsList"))return;const q=await db.from("deal_events").select("*").eq("deal_id",d.id).order("created_at",{ascending:false}).limit(20);if(q.error)return;el("eventsList").innerHTML=(q.data||[]).map(x=>'<div style="padding:9px 0;border-bottom:1px solid var(--line)"><b>'+esc(x.event_type)+'</b><div class="muted">'+new Date(x.created_at).toLocaleString('ar-SA')+'</div></div>').join('')||'<span class="muted">لا توجد أحداث بعد.</span>'}
function verification(){
if(state.role!=="admin")return "<div class=\"card\"><h2>غير مصرح</h2></div>";
return '<div class="head"><div><h2>مركز التحقق</h2><div class="muted">مراجعة حسابات التاجر والمورد والسائق والمستندات قبل تفعيل التعامل.</div></div><span class="tag">إدارة وسيط</span></div><div id="verifyList" class="card"><div class="muted">جاري تحميل طلبات التحقق...</div></div>';
}
async function loadVerification(){
if(state.role!=="admin"||!el("verifyList"))return;
const q=await db.from("profiles").select("*").in("verification_status",["pending","rejected"]).order("created_at",{ascending:false});
if(q.error){el("verifyList").innerHTML="<div class=\"muted\">تعذر تحميل الحسابات: "+esc(q.error.message)+"</div>";return}
const rows=q.data||[];
if(!rows.length){el("verifyList").innerHTML="<div class=\"muted\">لا توجد حسابات بانتظار المراجعة.</div>";return}
el("verifyList").innerHTML=rows.map(p=>`<div class="card" style="margin-bottom:12px;border-right:4px solid var(--blue)"><div style="display:flex;justify-content:space-between;gap:12px;align-items:center"><div><b>${esc(p.full_name||"بدون اسم")}</b><div class="muted">${esc(roles[p.role]||p.role)} · ${esc(p.business_name||"")}</div></div><span class="tag">${esc(p.verification_status)}</span></div><div class="muted" style="margin-top:8px">الجوال: ${esc(p.phone||"-")} · البريد: ${esc(p.email||"-")}</div><div class="muted">العنوان: ${esc(p.address||"-")}</div><div id="docs-${p.id}" style="margin-top:12px">جاري تحميل المستندات...</div><div class="field"><label>ملاحظة الإدارة</label><textarea id="note-${p.id}" rows="2" class="input" placeholder="سبب الرفض أو ملاحظة التحقق">${esc(p.verification_notes||"")}</textarea></div><div style="display:flex;gap:8px"><button class="btn" data-approve="${p.id}">اعتماد الحساب</button><button class="btn light" data-reject="${p.id}">رفض / طلب تعديل</button></div></div>`).join("");
for(const p of rows){
const d=await db.from("profile_documents").select("*").eq("user_id",p.id).order("created_at",{ascending:true});
const box=el("docs-"+p.id);
if(d.error){box.innerHTML="<div class=\"muted\">تعذر تحميل المستندات.</div>";continue}
box.innerHTML=(d.data||[]).map(x=>`<div style="display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)"><span><b>${esc(x.document_type)}</b> <span class="tag">${esc(x.status)}</span></span><button class="btn light" data-doc="${x.file_url}">فتح المستند</button></div>`).join("")||"<div class=\"muted\">لا توجد مستندات.</div>";
}
document.querySelectorAll("[data-doc]").forEach(b=>b.onclick=async()=>{const s=await db.storage.from("documents").createSignedUrl(b.dataset.doc,300);if(s.error)return alert(s.error.message);window.open(s.data.signedUrl,"_blank","noopener,noreferrer")});
document.querySelectorAll("[data-approve]").forEach(b=>b.onclick=()=>reviewAccount(b.dataset.approve,"approved"));
document.querySelectorAll("[data-reject]").forEach(b=>b.onclick=()=>reviewAccount(b.dataset.reject,"rejected"));
}
async function reviewAccount(id,status){
const note=el("note-"+id)?.value.trim()||null;
const p=await db.from("profiles").update({verification_status:status,verification_notes:note}).eq("id",id);
if(p.error)return alert(p.error.message);
const d=await db.from("profile_documents").update({status:status==="approved"?"approved":"rejected",notes:note}).eq("user_id",id);
if(d.error)return alert(d.error.message);
await loadVerification();
}
function verificationGate(){return state.role!=="admin" && state.profile && state.profile.verification_status!=="approved";}
function render(){
if(!state.logged){(async()=>{const {data}=await db.auth.getSession();if(data.session){state.user=data.session.user;const p=await db.from("profiles").select("*").eq("id",state.user.id).maybeSingle();if(p.data){state.profile=p.data;state.role=p.data.role;state.logged=true;await loadRemote();render()}else login()}else login();db.auth.onAuthStateChange(()=>{});})().catch(e=>{console.error(e);login()});return}
document.body.innerHTML=shell();
el("closeModal").onclick=()=>el("modal").classList.remove("show");
bindNav();
const main=el("main");
if(verificationGate()){
main.innerHTML=`<div class="card" style="max-width:700px;margin:40px auto;text-align:center"><div class="logo" style="margin:auto">✓</div><h2>الحساب قيد المراجعة</h2><p class="muted">تم استلام بياناتك ومستنداتك. لن تتمكن من تنفيذ الصفقات حتى تعتمد الإدارة الحساب.</p><div class="tag">${esc(state.profile?.verification_status||"pending")}</div>${state.profile?.verification_notes?`<p style="margin-top:14px"><b>ملاحظة الإدارة:</b> ${esc(state.profile.verification_notes)}</p>`:""}<button class="btn light" id="refreshVerification" style="margin-top:14px">تحديث حالة التحقق</button></div>`;
el("refreshVerification").onclick=async()=>{const p=await db.from("profiles").select("*").eq("id",state.user.id).single();if(!p.error){state.profile=p.data;render()}};
return;
}
if(state.page==="home")main.innerHTML=home();
if(state.page==="verification")main.innerHTML=verification();
if(state.page==="market")main.innerHTML=market();
if(state.page==="requests")main.innerHTML=requests();
if(state.page==="deals")main.innerHTML=deals();
if(state.page==="chat")main.innerHTML=chat();
bindDeal();bindProducts();bindChat();watchIncomingVoiceCalls();if(state.page==="verification")loadVerification();if(state.page==="requests")bindRequests();if(state.page==="deals")loadDealEvents();
if(el("marketBtn"))el("marketBtn").onclick=()=>nav("market");
}
login();
</script>
</body>
</html>
